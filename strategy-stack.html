:root[data-palette="praecipio"]{--bg:#ffffff;--hdr:#f3efe9;--mid:#332E27;--mid-stroke:#332E27;--mid-ink:#ffffff;--mid-muted:#D6D1CA;--mid-line:#C5B9AC;--mid-pill:#4A443D;--mid-pill-c:#5C2A3B;--mid-pill-stroke:#6E665E;--ink:#332E27;--muted:#7A6E67;--line:#9E968D;--font:Nunito Sans,Segoe UI,system-ui,sans-serif;--r0:#2B3F60;--r1:#4A6389;--r2:#6EABB3;--r3:#7A6E67;--r4:#9E968D;--strat:#0B6B74;--work:#4A6389;--prod:#A4809C;--hris:#8C2F49;--pill-a:#e9f1f1;--pill-b:#efedea;--pill-c:#f6e6e9;--pill-stroke:#C5B9AC;--pill-c-stroke:#c9a3b0;--rm1:#B699E1;--rm2:#8b6cc4;--vb1:#FFBE7A;--vb2:#C84F09}
body{margin:0;background:var(--bg);padding:16px 16px 24px;font-family:var(--font)}
.bar{max-width:1900px;margin:0 auto 10px;display:flex;justify-content:flex-end;gap:8px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;font-size:13px;font-weight:600}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);padding:7px 14px;cursor:pointer;font:inherit}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--r0);outline-offset:-2px}
.wrap{max-width:1900px;margin:0 auto;overflow-x:auto}
.wrap svg{width:100%;height:auto;min-width:900px;display:block;border-radius:16px}
[data-pal="dark"]{display:none}
:root[data-palette="praecipio"] [data-pal="dark"]{display:inline}
:root[data-palette="praecipio"] [data-pal="light"]{display:none}
</style>
