<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selling the Strategy Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,800;1,6..12,400&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#054950; --orange:#C84F09; --orange-soft:#F6DCCB;
  --bg:#FFFFFF; --card:#F6F8F8; --ink:#132426; --ink-2:#4A5C5E; --line:#D6DEDD;
  --good:#1F7A4D; --good-bg:#E3F2EA; --bad:#A2341B; --bad-bg:#F8E4DF;
  --why:#054950; --what:#0E6E78; --deliver:#2A8F86; --talent:#C84F09; --band-ink:#FFFFFF; --band-dim:#B8CBCD;
  --head:#054950;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
a{color:var(--head)}
.wrap{max-width:720px;margin:0 auto;padding:22px 20px 80px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
header h1{font-size:17px;font-weight:800;color:var(--head);margin:0;letter-spacing:-0.01em}
header button{background:none;border:0;color:var(--ink-2);font-size:14px;font-weight:600;padding:4px 0}
h2{font-size:28px;font-weight:800;letter-spacing:-0.015em;line-height:1.15;margin:0 0 8px}
.lead{color:var(--ink-2);margin:0 0 16px;font-size:16px}
.pic{background:var(--card);border-radius:18px;padding:16px 16px 8px;margin:0 0 20px}
.pic svg{width:100%;height:auto;display:block;overflow:visible}
.pic svg.flow text{font-family:"Nunito Sans",system-ui,sans-serif}
.pic .cap{font-size:14px;color:var(--ink-2);margin:8px 2px 6px}
.band{cursor:pointer}
.band rect.bg{transition:opacity .15s}
.band.dim rect.bg{opacity:.28}
.band.dim text{opacity:.5}
.band.dim .box{opacity:.35}
.band:hover rect.bg{opacity:.9}
.box{fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.55);stroke-width:1.2}
.arrow{stroke:var(--ink-2);stroke-width:2;fill:none;marker-end:url(#ah)}
.fig.plain{padding:0;border:0;background:none}
.stackimg{width:100%;height:auto;display:block;border-radius:12px}
.pathcard{display:grid;gap:10px;margin-bottom:26px}
.mod{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;width:100%}
.mod:hover{border-color:var(--teal)}
.mod .n{flex:0 0 36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--teal)}
.mod .n.done{background:var(--good)}
.mod .n.locked{background:var(--line);color:var(--ink-2)}
.mod b{display:block;font-weight:800}
.mod span{color:var(--ink-2);font-size:15px}
.mod[disabled]{cursor:default;opacity:.7}
.mod[disabled]:hover{border-color:var(--line)}
.test{background:var(--teal);color:#fff;border-radius:18px;padding:22px 24px;margin-bottom:26px}
.test h3{margin:0 0 6px;font-size:18px;font-weight:800}
.test p{margin:0 0 6px;opacity:.95}
.test p:last-child{margin:0}
.test a{color:#FFD9C2;font-weight:700}
.sec{margin:0 0 24px}
.sec h3{font-size:19px;font-weight:800;color:var(--head);margin:0 0 8px;letter-spacing:-0.01em}
.sec p{margin:0 0 12px}
.sec b,.lead b,.test b,.ov b{font-weight:800}
.sec ul,.sec ol{margin:0 0 12px;padding-left:22px}
.sec li{margin-bottom:6px}
.sec .mark{font-size:14px;color:var(--ink-2)}
.ov{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media (max-width:540px){.ov{grid-template-columns:1fr}}
.ov div{background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px}
.ov div b{font-weight:800}
.ov div > b:first-child{display:block;margin-bottom:6px}
.ov .out b{color:var(--bad)}.ov .outc b{color:var(--good)}
.hs{background:var(--card);border-radius:14px;padding:18px 20px;margin-bottom:12px;border-left:5px solid var(--orange)}
.hs .h{font-style:italic;color:var(--ink-2);margin:0 0 10px;font-size:17px}
.hs .h::before{content:"\201C"}.hs .h::after{content:"\201D"}
.hs .lab{font-size:14px;color:var(--ink-2);margin:0 0 2px}
.hs .s{font-weight:600;color:var(--head);margin:0 0 10px;font-size:18px;line-height:1.4}
.hs .w{margin:0;font-size:15px}
.chk{background:var(--card);border-radius:14px;padding:18px 20px;margin-bottom:12px}
.chk p.q{font-weight:600;margin:0 0 10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#FFFFFF;border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;line-height:1.4;font-size:16px}
.opt:hover{border-color:var(--teal)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.dim{opacity:.5}
.chk .fb{margin:10px 0 0;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 0}
.btn{background:var(--teal);color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:700;font-size:16px}
.btn.alt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.orange{background:var(--orange)}
.btn[disabled]{opacity:.5;cursor:default}
.crumb{font-size:14px;color:var(--ink-2);margin:0 0 6px}
.crumb a{color:var(--head);font-weight:600;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.note{font-size:14px;color:var(--ink-2)}
.fig{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 12px}
.fig img{width:100%;max-width:100%;height:auto;display:block;border-radius:8px}
.fig p{font-size:14px;color:var(--ink-2);margin:10px 4px 0}
.eyebrow{font-size:13px;font-weight:800;color:var(--orange);letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}
h2.hero{font-size:34px;margin:0 0 8px}
.two-up{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 20px}
@media (max-width:620px){.two-up{grid-template-columns:1fr}}
.two-up figure{margin:0;background:var(--card);border-radius:14px;padding:10px}
.two-up img{width:100%;height:auto;display:block;border-radius:8px}
.two-up figcaption{font-size:13px;color:var(--ink-2);margin:8px 2px 0;line-height:1.4}
.two-up figcaption a{font-weight:700}
.nowfuture{display:grid;grid-template-rows:1fr 1fr;gap:14px}
.nf{border-radius:14px;padding:16px 18px;font-size:15px;line-height:1.5}
.nf p{margin:0}
.nf-label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px!important}
.nf.now{background:var(--teal);color:#fff}
.nf.now .nf-label{color:#BFE3E6}
.nf.future{background:var(--orange-soft);color:var(--ink)}
.nf.future .nf-label{color:var(--orange)}
.intro{background:var(--card);border-radius:18px;padding:20px 22px;margin:0 0 22px}
.intro h3{font-size:14px;font-weight:800;color:var(--orange);letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px}
.intro .big{font-size:20px;line-height:1.4;margin:0 0 14px}
.intro ul{margin:0 0 14px;padding-left:20px}
.intro li{margin-bottom:8px}
.intro .note{margin:8px 0 0}
.diff{background:#fff;border:1.5px solid var(--teal);border-left:6px solid var(--teal);border-radius:12px;padding:14px 18px;margin:0 0 12px}
.diff p{margin:0}
.diff .diff-h{font-weight:800;font-size:17px;color:var(--teal);margin:0}
.sec .diff + p{margin:0 0 18px}
.callout{background:var(--orange-soft);border-left:5px solid var(--orange);border-radius:14px;padding:16px 20px;margin:0 0 20px}
.callout h3{font-size:16px;font-weight:800;color:var(--ink);margin:0 0 6px}
.callout p{margin:0 0 6px;font-size:15px}
.callout p:last-child{margin:0}
.callout a{font-weight:700;color:var(--orange)}
.src{background:var(--card);border-radius:14px;padding:16px 20px;margin-bottom:26px}
.src h3{font-size:16px;font-weight:800;color:var(--head);margin:0 0 6px}
.src p{margin:0 0 4px;font-size:15px}
.src p:last-child{margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <p><b>Executives want to know what is being done and when</b>, so they can make revenue decisions. <b>Product people want to know what is changing</b>, so they can keep the product stable. Both are asking questions of the same work. In most companies, the same feature answers both questions through two separate reporting chains, each built by hand, each stale by the time it is read.</p>
  <div class="pic">${picture()}<p class="cap">The Atlassian stack, as we show it to customers. <a href="strategy-stack.html" target="_blank" rel="noopener">Open it full size</a>.</p></div>
  <p><b>The Atlassian picture puts that one work item in the middle.</b></p>
  <ol>
  <li><b>Strategy sits in Focus.</b> In this example, Strategy and Themes are both Focus Areas; customers keep their own naming conventions.</li>
  <li><b>Focus Areas represent investments</b>, and they carry <b>funding and goals</b> for those investments.</li>
  <li><b>They also carry the funding: budgets.</b> Some organizations divide the high-level investment into <b>CAPEX and OPEX</b> budgets.</li>
  <li><b>Talent brings in people and hours from the HRIS</b>, so the cost behind the work is visible too.</li>
  <li><b>Product sits in Jira Product Discovery.</b> Products are informed by the enterprise context and take their <b>prioritization cue from the strategic goals</b>.</li>
  <li>Products are <b>assessed, scored and become a roadmap</b>.</li>
  <li><b>Both connect down into Work in Jira</b>, where initiatives break into epics and epics into stories.</li>
  </ol></div>
  <div class="sec"><h3>The selling point, from the top</h3>
  <p><b>Everyone works from the same enterprise context.</b> That is what an executive is buying. Today the CPO, the product leads and the delivery teams each hold a different version of what matters, and every decision is made in whatever slice of the picture that person can see. Put strategy, product and work on one picture and nobody makes a decision in a vacuum anymore. The connections between the three sit at the right level, <b>governance and training keep them there</b>, and <b>visibility becomes automatic</b>: seen, not assembled.</p>
  <ul>
  <li><b>Executives</b> see what is being done and when, against the priorities and budgets they set, without a deck being built for them. They decide on a current picture, and they can defend the investment to the board and the CFO.</li>
  <li><b>Product</b> gains alignment with strategy. Ideas are assessed and scored against what leadership already committed to, so the roadmap is defensible and prioritization stops being political.</li>
  <li><b>Delivery teams</b> connect to both, with more flexibility, not less. They keep running the way they run. The connections between strategy, product and delivery sit at the right level, governance and training keep them there, and visibility becomes automatic instead of assembled.</li>
  </ul>
  <p><b>Why the executive wants this:</b> they are accountable for hundreds of people and tens of millions in investment, and the system that tells them whether that money is funding company strategy does not exist. This gives them that system on the platform their teams already use, with every level of the organization reading from the same context. That is the single differentiator, the one thing Atlassian wants us to remember, and the sentence every use case in the play comes back to: <b>the whole enterprise context now lives in one system, from strategy to product to delivery, natively, without integration work.</b> Every competitor needs middleware or a manual hand-off to connect those layers. Atlassian doesn't.</p>
  <p><b>Every pain you will hear is a missing line on this picture.</b></p><ul><li><b>"Product is shipping things with no connection to strategy"</b> is Product connected to Work but not to Strategy.</li><li><b>"The exec deck takes two days"</b> is Strategy with no live line from Work.</li><li><b>"Prioritization is political"</b> is Product scoring ideas without knowing what Strategy already committed to.</li></ul><p>When you can see where the pain lives, you know what to lead with.</p></div>
  <div class="sec"><h3>Why now: AI has changed the clock</h3>
  <p><b>Work that used to take a quarter now takes weeks, and work that took weeks now takes days.</b> AI has compressed delivery time across product and engineering, and most organizations have not noticed what that does to the rest of the picture. Strategy is still reviewed quarterly. The roadmap is still rebuilt in a deck. The link from goals to delivery is still assembled by hand on a cadence designed for a slower world.</p>
  <ul><li><b>Delivery moves in days.</b> By the time a quarterly review opens, the work it is reviewing has already changed shape twice.</li>
  <li><b>Decisions still move in quarters.</b> Atlassian's own research found that <b>68% of product teams win back up to two hours a day with AI, yet still cannot carve out time for strategic planning and roadmap development</b>. The time went back into output, not into deciding what the output should be.</li>
  <li><b>The gap between the two is where misalignment lives.</b> Faster delivery of the wrong thing is more expensive, not less.</li></ul>
  <p>That is why this is the <b>AI-age strategy stack</b>: when delivery is this fast, the only way strategy and product keep up is if the connection to work is live and automatic. A deck cannot be rebuilt as often as the work now changes. <b>Sellers should name this plainly with executives</b>: the speed of their teams has outrun the speed of their planning, and the fix is not a faster deck, it is one system where the context updates itself.</p></div>
  <div class="sec"><p class="note"><a href="${FLOW_URL}" target="_blank" rel="noopener">Open the full Planning Flow</a> for the detailed version with <b>Jira Plans</b>, analytics and the public roadmap.</p></div>
  <div class="sec"><h3>The whiteboard test</h3>
  <p>By the end of these modules you will be able to <b>draw this picture and narrate it in about ninety seconds</b>, in the customer's terms, with Strategy and Product on the board and the work item between them <b>before you name a product</b>. Do that, and the use cases and persona questions take care of themselves.</p></div>`,
  hs:[
   {h:"Our teams are shipping faster than ever with AI. Honestly, it's getting harder to keep track of what they're building.", s:"That's the pattern we see everywhere right now. Delivery moved to days; your planning cadence is still quarterly, so the picture leadership works from is out of date the moment it's built. The answer isn't a faster deck. It's one system where strategy, product and work share the same context and it updates itself as the work changes.", w:"Names the AI clock and turns a brag about speed into the reason for the conversation. Lead with the gap, not the products."},
   {h:"Our strategy lives in slides, our work lives in Jira, and nothing connects them.", s:"Right now your executives, your product team and your delivery teams are each deciding from a different slice of the picture, and every answer upward is a person building a deck. Put them on one enterprise context and nobody decides in a vacuum: leadership sees what is being done against the priorities they set, product aligns to strategy, and delivery keeps running the way it runs.", w:"Leads with what the executive gets, the shared context, before any product name. The three audiences are the structure of the answer."}
  ],
  checks:[
   {q:"Why does AI make the strategy-to-work connection more urgent, not less?", o:["AI tools need their own Focus Area","Delivery now moves in days while planning still moves in quarters, so a hand-built link is stale before it is read","AI replaces the need for product discovery"], a:1, f:"Faster delivery widens the gap between how often work changes and how often strategy reviews it. The only connection that keeps up is one that updates itself."},
   {q:"A CPO says product teams are shipping constantly but leadership can't tell whether any of it ladders up to company goals. Where on the picture is the break?", o:["Between Work and Product","Between Product and Strategy","Inside Talent"], a:1, f:"Product is connected to Work and things are getting built; what's missing is the line up to the priorities leadership committed to. That is the alignment play, and it's where Focus and JPD connect."},
   {q:"What does \"governance determines how\" mean in this picture?", o:["Delivery teams must restructure their boards to match the executive hierarchy","Strategy, product and delivery connect at the right level, and governance and training keep them there, so visibility becomes automatic while teams keep working as they do","Only executives can create Initiatives"], a:1, f:"Work lives as delivery needs it to. Governance sets where strategy, product and delivery connect; training keeps the connections there as teams and priorities change. That is what turns visibility from a reporting task into something automatic, and it is the work we do with the client."},
   {q:"What is the single differentiator Atlassian wants you to remember?", o:["Focus has the best OKR reporting on the market","The whole enterprise context is in one system, from strategy to product to delivery, with no integration","Strategy Collection is cheaper than Planview"], a:1, f:"Everything else in the play hangs off this sentence. Competitors need middleware or a manual hand-off to connect strategy, product and delivery. Atlassian doesn't."}
  ]},
 {id:"why", n:2, title:"Focus: from investment to ROI", mins:"6 min", teaser:"What leadership committed to, and whether product is funding it, without a data pull.", band:"why",
  body:`
  <div class="sec"><h3>What Focus is, in Atlassian's words</h3>
  <p><b>Strategy Collection</b> (Focus plus Talent) is an enterprise strategy and portfolio management layer for leadership and operations teams. Its core value: it connects strategic goals, expressed as <b>Focus Areas</b>, to execution in Jira delivery and JPD roadmaps, live, without manual reporting.</p>
  <p>A <b>Focus Area</b> is a priority leadership has committed to for a planning horizon, say 2026 to 2027. Underneath it sit sub-areas that can be treated as <b>CAPEX</b> (new things we're building) or <b>OPEX</b> (keep-the-lights-on work). OKRs attach to the Focus Area and to the work beneath it. Leadership keeps that funding distinction at the executive level and simply connects to delivery work, without changing how teams operate.</p></div>
  <div class="sec"><h3>See it in a few minutes</h3>
  <div class="fig" style="padding:0;overflow:hidden"><div style="position: relative; padding-bottom: 85.57844690966719%; height: 0;"><iframe src="https://www.loom.com/embed/a941502732174cfaa9f7fa5df346c37d" title="Focus walkthrough" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe></div></div>
  <p class="note">A short walkthrough of Focus Areas, OKRs and the live portfolio view. If the player doesn't load here, <a href="https://www.loom.com/share/a941502732174cfaa9f7fa5df346c37d" target="_blank" rel="noopener">open it on Loom</a>.</p></div>
  <div class="callout"><h3>Where Strategy Collection is heading</h3>
  <p>Atlassian's FY26 roadmap for the Strategy Collection: <b>Funds</b> (budgets, costs and benefits on Focus Areas), <b>Strategic Events</b> (a systematic proposal flow instead of side decks), a new <b>For You</b> leader experience with Rovo-generated insights, and <b>Talent</b> workforce skills and AI spend. Useful when a customer asks what's next; sell what's available today.</p>
  <p><a href="https://docs.google.com/presentation/d/18qHcWt8FG6gm_yf5dnA3ylxQVcPgogXE/edit?usp=drive_link&ouid=112312400283269083393&rtpof=true&sd=true" target="_blank" rel="noopener">Download the full roadmap (pptx)</a>. Opens in a new tab. This version can be shared with clients.</p></div>
  <div class="sec"><h3>The problem it solves</h3>
  <p>CPOs and CTOs are accountable for hundreds of people and tens of millions in product investment, but the system that tells them whether that investment is funding company strategy usually doesn't exist. They assemble it by hand every quarter. Atlassian calls this the <b>accountability gap</b>, and it shows up two ways:</p>
  <ul><li><b>Misalignment</b>: teams ship features leadership can't connect to company OKRs, because the roadmap and the strategy live in separate systems.</li>
  <li><b>Invisibility</b>: there is no <b>live view</b> of which product bets are funding which priorities. Leadership gets a slide deck that is already stale when it hits the room.</li></ul>
  <p>Behind both is the reporting cost. A <b>Program Lead</b> or Chief of Staff spends days each quarter pulling data from Jira, JPD and spreadsheets to build the leadership deck. Decisions get made on data that is two weeks old.</p>
  <p>The Atlassian answer: Focus Area updates surface automatically from Jira execution, including work that started in JPD. Leadership gets a <b>live portfolio view</b>: which initiatives are tied to which goals, how they are tracking, what is at risk. JPD ideas become traceable investments instead of invisible activity.</p></div>
  <div class="sec"><h3>When to lead with Focus</h3>
  <p>Lead with Strategy Collection when leadership can't see whether product investment is funding company strategy, or when portfolio prioritization is political and manual. Then connect to JPD as the source of the product-level decisions that feed the Focus Areas.</p>
  <p>Don't lead with features. The CPO does not care about Focus Area facets. Open on the accountability gap.</p><p class="note">Source: <a href="https://atlassianpartners.atlassian.net/wiki/spaces/resources/pages/754155521/Strategy+Collection" target="_blank" rel="noopener">Strategy Collection on the Partner Portal</a>.</p></div>
  <div class="sec"><h3>Who sees it</h3>
  <p>People who create and edit Focus Areas need a paid Strategy Collection license. Everyone else on Jira Premium or above can use the free <b>Viewer role</b> to see how their work rolls up to strategy. It is not a backdoor license: anyone who plans needs a paid seat, and the <b>50-license minimum</b> still applies.</p></div>`,
  hs:[
   {h:"Every time our CPO presents to the exec team, she spends two days building a slide deck. The data is stale by the time she presents it.", s:"Focus Area updates surface automatically from Jira execution, including work that started in JPD. Leadership gets a live view of product investment tied to strategic goals, and the Program Lead gets a week back every quarter.", w:"Executive reporting is the unifying use case. It lands with the Org Leader and the Business Leader at once, and it is how you keep the product and strategy buyers in the same conversation."},
   {h:"Leadership can't see whether product is working on the right things.", s:"Right now that answer takes a manual data pull. Focus gives leadership a live portfolio view, which initiatives are tied to which strategic goals, how they're tracking, what's at risk, and JPD is where the product decisions feeding that view are made.", w:"Lead with Focus, then connect to JPD. This is the classic Focus value proposition: the portfolio view without the slide deck."}
  ],
  checks:[
   {q:"Which opening question does Atlassian recommend for a CPO?", o:["Have you seen how Focus Areas roll up OKRs?","You're responsible for hundreds of people and tens of millions in product investment. How do you know it's funding the right strategic priorities?","Would you like a demo of the live portfolio view?"], a:1, f:"Open on the accountability gap, not on features. The product comes after they've named the pain."},
   {q:"A Head of PMO asks whether all 900 Jira users need a Strategy Collection license to see the Focus Areas.", o:["Yes, every Jira user needs one","No, only planners need paid seats; Jira Premium users can use the free Viewer role","No, Viewers are free so a handful of paid seats will cover the organization"], a:1, f:"The Viewer role is for people who only need to see how work rolls up. It isn't a way around paid seats for people who plan, and the 50-license minimum still applies."},
   {q:"Focus keeps CAPEX and OPEX distinctions where?", o:["On every Jira story so finance can audit it","At the executive level, connected to delivery work without changing how teams operate","Inside JPD scoring fields"], a:1, f:"Leadership keeps the funding view at the top of the picture. Delivery teams keep working the way they already do."}
  ]},
 {id:"what", n:3, title:"JPD: the right separation, connection and flexibility for product", mins:"9 min", teaser:"From customer insight to roadmap decision, and the link that connects it to strategy.", band:"what",
  body:`
  <div class="sec"><h3>What JPD is, in Atlassian's words</h3>
  <p><b>Jira Product Discovery</b> is a product discovery and prioritization tool for product managers and product teams. Its core value: structured discovery from customer insight to roadmap decision. It gives product teams a shared, prioritized view of what to build next and why. It replaces spreadsheets, Aha! and ProductBoard for discovery and prioritization.</p>
  <p>On the picture, JPD is the What level. Ideas come in from users, product leads and big company initiatives. The team assesses them, scores them against a framework, organizes them, and the survivors become a product roadmap that can be shared publicly with stakeholders, partners and customers who don't hold a JPD license.</p></div>
  <div class="sec"><h3>The idea underneath it: outcomes, not outputs</h3>
  <p>Atlassian's Product Discovery Handbook is built on one shift: from a <b>project-centric</b> approach to a <b>product-centric</b> one. Projects end; products live as long as customers use them. Project success is shipping specific features on a date. Product success is delivering a measurable outcome.</p>
  <div class="ov"><div class="out"><b>Outputs</b>Ship 10 features by a date. Launch on time. Publish three pieces of content.</div><div class="outc"><b>Outcomes</b>Cut support tickets for a feature from 50 a week to 5. Lift trial-to-paid conversion. Prove customers solved a specific problem.</div></div>
  <p>This is why JPD organizes work around ideas, insights and prioritization rather than a feature list. Teams hypothesize how an idea will move an outcome, test it, and iterate. Prioritization gets easier because it is clear which ideas have the highest potential impact on the goal.</p>
  <p class="mark">This is also the language your product-side buyer already speaks. A VP Product who talks about outcomes over outputs is halfway to the Why level; they just don't have the line drawn to it yet.</p></div>
  <div class="sec"><h3>What this looks like at a real client</h3>
  <p>This is a slide from a current Praecipio engagement: a large digital technology organization that surveyed its own product teams before starting a <b>JPD proof of concept</b> with us.</p>

  <ul><li><b>75% keep the roadmap in a static document or a deck.</b> Across one room it lived in five different places.</li>
  <li><b>50% need half a day or more to update the roadmap</b>, and for 30% it takes a week or more.</li>
  <li><b>73% choose what comes next without a scoring model</b>: judgment, internal debate, or direction from above.</li>
  <li><b>60% say essentially all of next quarter is already committed</b>, so new insight has nowhere to go.</li></ul>
  <p>Read it against the picture. Five roadmaps in five places is <b>no shared intake</b>. A week to update is <b>no live roadmap</b>. No scoring model is <b>assess and score missing</b>. A fully committed quarter is a roadmap that cannot react when strategy moves, which is the continuous-planning gap waiting one level up. Every one of these is a sentence you can use in discovery with the next customer, because their product teams will recognize themselves in it.</p>
  <p>Here is how we framed the opportunity back to them. Notice it is the picture from module 1 in the client's own vocabulary: <b>value and context</b> (goals, outcomes, prioritization) above, <b>live delivery</b> (epics, stories) below, and one connection between them instead of a link <b>rebuilt by hand</b> every time someone needs to see it.</p>

fcpyG+5UiJZSPkN9ynIb7lSIllI+Q33KchvuVIiWUj5DfcpyG+5UiJZSPkN9yq2sDBsF9RQEREBERAREQEREBERAVL42v7jr7qpEEXlmfNPLM+alRXaU1hF5dnzTy7PmpUTaTWEXlme5TyzfcqVE2k1hF5ZvuU8s33KlRNpNYReWb7lPLM9ypUTaTWEXlme5TyzPcqVE2k1hF5ZnuU8sz3KlRNpNYReWZ7lPLM9ypUTaTWEXlme5TyzPcqVE2k1hF5ZnuU8s33KlRNpNYReWb7lPLN9ypUTaTWEXlm+5TyzfcqVE2k1hF5ZvuU8s33KlRNpNYReWb7lPLN9ypUTaTWEXlm+5TyzfcqVE2k1hF5ZvuU8s33KlRNpNYReWb7lPLN9ypUTaTWEXlm+5TyzfcqVE2k1hF5ZvuU8s33KlRNpNYReWZ7lPLM9ypUTaTWEXlme5TyzPcqVE2k1hF5ZnuU8sz3KlRNpNYReWZ7lPLM9ypUTaTWEXlme5TyzPcqVE2k1hF5ZnuU8sz3KlRNpNYReWZ7lPLM9ypUTaTWEXlme5TyzPcqVE2k1hF5ZvuU8sz3KlRNpNYRtgY077b/VSIiTNrQiIoCIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgA7jcIo4P0QUiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiICIiAiIgIiIP/Z" alt="Client slide titled Create clearer connection between value and delivery. Today: value and context sit apart from live delivery and the link is rebuilt by hand; reviews spend their time establishing where things stand. How we could evolve: one unified approach to connecting work; status comes from delivery rather than being rebuilt for each review; reviews open on a current picture and progress against a goal can be seen, not assembled."><p>Client slide, internal. The ask was simple: let status come from delivery, so reviews open on a current picture and the time goes to deciding what comes next.</p></div>
  <ul><li><b>What it costs today:</b> reviews spend their time establishing where things stand, and the answer is only as current as the last manual update.</li>
  <li><b>What improves:</b> progress against a goal can be <b>seen, not assembled</b>. Reviews open on a current picture, so the time goes to deciding what comes next.</li></ul>
  <p>"Seen, not assembled" is the whole Strategy Collection pitch in three words, and a client wrote it. Use it.</p></div>
  <div class="sec"><h3>When to lead with JPD</h3>
  <p>Lead with JPD when the product team has no structured discovery process, or when ideas are scattered across tools with no prioritization framework. Then connect to Focus so leadership can see the link between the roadmap and the <b>Focus Areas</b>.</p></div>
  <div class="sec"><h3>The connection that makes this a joint play</h3>
  <p>JPD on its own scores ideas in a vacuum. Teams optimize locally and portfolio prioritization stays political. <b>Strategy Collection supplies the enterprise context that makes JPD prioritization defensible:</b> when a product team scores an idea, they can ground it against the Focus Areas leadership has already committed to.</p>
  <p>There are two connections, and they do different jobs. <b>Up to strategy, a JPD idea connects to a Goal, and the Goal rolls up to a Focus Area.</b> That is the direct line from discovery to what leadership committed to, and it is how product scores ideas against strategy. <b>Down to delivery, a JPD idea links to a Jira work item, usually an Epic.</b> That is how you see whether delivery is actually building what discovery decided. Together they make the chain from strategy to execution visible from the C-suite down to the product team. Atlassian calls this the <b>uniquely Atlassian wedge</b>: no competitor does strategy-to-discovery natively on one platform. It is the moment the enterprise context becomes one system, from strategy to product to delivery.</p><p class="note">Source: <a href="https://atlassianpartners.atlassian.net/wiki/spaces/resources/pages/359039411/Jira+Product+Discovery+JPD" target="_blank" rel="noopener">Jira Product Discovery on the Partner Portal</a>.</p></div>`,
  hs:[
   {h:"We're building fast but missing our OKRs.", s:"Shipping on time only matters if the work moves the outcomes you care about. JPD gives your team structured discovery and prioritization against goals. Each idea connects to a Goal that rolls up to the Focus Area leadership committed to, so you can see which bets are actually funding the OKRs, and the link to the Jira epic shows whether delivery is building them.", w:"Lead with JPD, then connect to Focus. The handbook's outcomes language and the Focus Area connection in one breath."},
   {h:"Our roadmaps live in decks. Every team keeps its own, and updating them is a week of work nobody has.", s:"We hear that a lot. At one client, three quarters of product teams kept the roadmap in a static deck and half needed at least half a day to update it. JPD gives every team one place for intake, a scoring model for what comes next, and a roadmap that updates itself from the work, so the week of updating goes away and leadership sees the same picture you do.", w:"Lead with JPD. Use the client numbers as proof you have seen this before, then connect to Focus once the roadmap exists."},
   {h:"Our reviews spend most of the hour working out where things actually stand.", s:"That hour is the cost of the link between goals and delivery being rebuilt by hand. When the roadmap in JPD and the work in Jira are connected, status comes from delivery. Reviews open on a current picture, and progress against a goal is seen, not assembled. The hour goes to deciding what comes next.", w:"A client's own framing, almost word for word. It bridges naturally from JPD to Focus: once status comes from delivery, leadership wants it rolled up to priorities."},
   {h:"We have 40 ideas in JPD and 12 active initiatives. Every team thinks their work is the priority, so we decide in meetings instead of with data.", s:"Your team can score ideas in JPD against the Focus Areas leadership has already committed to, and when the planning cycle runs you can see which roadmap items are competing for the same people or budget. Prioritization becomes defensible instead of political.", w:"JPD plus Focus, then Talent for capacity. If they've looked at Jira Align, SAFe consultants or Planview, this is the clearest reason to choose Focus plus JPD instead: no transformation program first."}
  ],
  checks:[
   {q:"Which of these is an outcome, in the handbook's sense?", o:["Launch the new onboarding flow by March 31","Reduce support tickets for onboarding from 50 a week to 5","Ship ten onboarding improvements this quarter"], a:1, f:"Outputs are the mechanism by which work gets done. Outcomes are the value the work delivered, measured in customer or business behavior."},
   {q:"How does a JPD idea connect to strategy?", o:["Through the Jira epic it is linked to","Through a Goal, which rolls up to a Focus Area","Through the public roadmap"], a:1, f:"Up to strategy is through the Goal. The link to a Jira work item is the other connection: it shows whether delivery is building what discovery decided."},
   {q:"At the client in this module, 60% said essentially all of next quarter was already committed. Which gap one level up does that point to?", o:["Executive reporting","Continuous planning: the roadmap cannot react when strategy changes","Workforce planning"], a:1, f:"A fully committed quarter means a strategy shift has nowhere to land until the next planning cycle. That's the continuous-planning play, and it's your bridge from the JPD proof of concept to the Focus conversation."},
   {q:"The customer's product team has no discovery process and ideas live in six spreadsheets. Leadership is not yet complaining about visibility. What do you lead with?", o:["Focus, because leadership visibility is the bigger value","JPD, then connect to Focus once the first value is established","Talent, to show who is working on what"], a:1, f:"Lead with the product that solves the loudest pain, then connect the other once the first value lands. Here the loudest pain is at the What level."}
  ]},
 {id:"talent", n:4, title:"Talent: people and cost behind the work", mins:"5 min", teaser:"Positions from Workday mapped to Focus Areas. Who is on it and what it costs.", band:"talent",
  body:`
  <div class="sec"><h3>What Talent is, in Atlassian's words</h3>
  <p><b>Talent</b> is a knowledge workforce planning app that helps company and business leaders put the right people on the right strategic priorities. Companies map their workforce to their <b>Focus Areas</b>, plan and design the organization they need, and get insights to make the right allocations for maximum impact. Atlassian built it for its own planning as the company grew, and it now runs the quarterly cycle there.</p>
  <p>It works in two steps. In Focus, leaders define their strategic priorities as Focus Areas. In Talent, they assign knowledge-worker positions to those Focus Areas. The result is <b>headcount allocation against strategic priorities</b>, which is the question a spreadsheet can never answer reliably.</p></div>
  <div class="sec"><h3>See it in three minutes</h3>
  <div class="fig" style="padding:0;overflow:hidden"><div style="position: relative; padding-bottom: 85.57844690966719%; height: 0;"><iframe src="https://www.loom.com/embed/d91aa1b889414868bfbd7de610fbe002" title="Talent walkthrough" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"></iframe></div></div>
  <p class="note">A short walkthrough of Talent alongside Focus Areas. If the player doesn't load here, <a href="https://www.loom.com/share/d91aa1b889414868bfbd7de610fbe002" target="_blank" rel="noopener">open it on Loom</a>.</p></div>
  <div class="sec"><h3>Why workforce planning is broken for these customers</h3>
  <p>Every enterprise does workforce planning; it is how business strategy becomes people strategy. But in technology-driven companies, knowledge workers are fungible and adaptable, and they pivot between priorities fast. Spreadsheet-based planning can't keep up, so it ends up fragmented and out of date. Two numbers Atlassian uses:</p><ul><li><b>93% of Fortune 100 executives lack confidence that their teams' work supports the biggest company goals.</b></li><li><b>McKinsey found that 20 to 30% of critical roles aren't filled by the most appropriate people.</b></li></ul></div>
  <div class="sec"><h3>Where it shows up in the joint play</h3>
  <ul><li><b>Portfolio prioritization:</b> JPD scores the ideas, Focus supplies the commitments, Talent shows what is actually fundable with the people available.</li>
  <li><b>Cost to ROI</b>: Talent completes the traceability from investment to cost, and Focus Goals complete the traceability from that cost to the actual outcome.</li>
  <li><b>Executive reviews:</b> leadership sees headcount shifting toward or away from each priority, planning cycle over planning cycle.</li></ul>
  <p>On the picture, every <b>Focus Area</b> and initiative carries a cost, labor and non-labor. Talent is what makes labor cost visible alongside the funding treatment.</p></div>
  <div class="sec"><h3>What to know before the question comes</h3>
  <p>At GA, Talent has a built-in connector for <b>Workday</b>, refreshing position data <b>every six hours</b>. Other HRIS systems can connect through <b>API or webhook</b>; that is integration work we scope with the client. Atlassian recommends customers normalize and clean up data in the HRIS, not in Talent. Who buys: the company leader (CEO, CTO, CIO, CPO) who wants the right people on the right priorities, and business leaders (Chief of Staff, SVP, VP, portfolio lead) who need to see bench strength, gaps and where to invest next.</p></div>`,
  hs:[
   {h:"I can't tell whether the right people are on our most important priorities. Our workforce plan is a spreadsheet nobody trusts.", s:"Talent maps your knowledge-worker positions to the Focus Areas you set in Focus. You see headcount allocation against each priority and adjust it inside the planning cycle, instead of rebuilding a spreadsheet every quarter.", w:"Lead with Talent, anchored in Focus Areas. The spreadsheet is the competitor; make its cost visible."},
   {h:"How is Talent different from what HR already has in Workday?", s:"Your HRIS holds the positions. Talent pulls them in, with a built-in Workday connector refreshing every six hours or an API or webhook integration for other systems, and maps them to your strategic priorities so you can see headcount against Focus Areas. An HRIS doesn't do that, and it isn't trying to.", w:"Accurate on the integration and clear on the job Talent does. Never say it replaces the HRIS."}
  ],
  checks:[
   {q:"Which HRIS does Talent connect to at GA, and how often does it refresh?", o:["Any HRIS, in real time","Workday through a built-in connector, every six hours; other HRIS systems through API or webhook","Workday and SAP SuccessFactors, nightly"], a:1, f:"Workday is the built-in connector, with a six-hour refresh. Other HRIS systems connect through an API or webhook integration we scope with the client. Either way, clean the data in the HRIS, not in Talent."},
   {q:"What is the first step before Talent can do anything useful?", o:["Import the org chart from Workday","Define strategic priorities as Focus Areas in Focus","Build a capacity model in Jira Plans"], a:1, f:"Talent assigns positions to Focus Areas. Without Focus Areas there is nothing to assign to, which is why the two are sold together."},
   {q:"In the prioritization use case, what does Talent add that Focus plus JPD can't?", o:["A better scoring matrix","What is actually fundable with the people available","A public roadmap"], a:1, f:"JPD scores, Focus supplies the commitments, Talent shows capacity. That is what turns a priority list into a defensible plan."}
  ]},
 {id:"deliver", n:5, title:"Jira: the right amount of governance in delivery to get the right answers", mins:"5 min", teaser:"Portfolio epics, epics, stories, and why governance decides where work connects.", band:"deliver",
  body:`
  <div class="sec"><h3>Jira is the delivery engine</h3>
  <p>This is where the two audiences meet. Executives and product people are both asking questions of the same feature, and the feature has to answer both without the team changing how it works. Whether it is brand new work or a new product, everything eventually has to connect to the teams doing the work. Teams have all kinds of structures, and work can connect at any level of the hierarchy. That is exactly why <b>governance</b> matters: someone has to decide where the connections happen so that they happen at the right level.</p>
  <p>The simplest version of <b>the spine</b> is a <b>parent-child</b> chain in Jira. A <b>Portfolio Epic</b> spans a year and connects directly to a company initiative. It breaks into month-long Epics, which break into week-long Stories. The parent-child relationship built into Jira describes what is happening on the initiative without anyone writing a status report.</p></div>
  <div class="sec"><h3>Why this is what makes "live" true</h3>
  <p>Every promise in the Why module depends on this level. <b>Focus Area</b> updates surface automatically from Jira execution only if the work is connected to the Focus Area through the spine. Linking a JPD idea to a Jira work item, usually an Epic, is the hand-off from the What level into this spine; it is how you see delivery delivering what discovery decided. The idea's connection up to strategy runs separately, through its Goal to the Focus Area. If the spine is broken or inconsistent, the <b>live view</b> is incomplete and leadership goes back to building the deck.</p>
  <p><b>Jira Plans</b> gives the cross-cutting roadmap once the connections exist: the same feature can show its relationship to a goal, an OKR, a strategic initiative and a product, with a Gantt view you can navigate from top to bottom. The analytics layer is where leadership slices it all: by funding (<b>CAPEX</b>/<b>OPEX</b>), by work item, by initiative, by product, or by goal.</p></div>
  <div class="sec"><h3>What this means for a seller</h3>
  <p><b>A customer with a messy hierarchy is not disqualified. It is the reason they need Praecipio.</b> Atlassian's own partner guide names <b>Focus and Talent configuration</b> and <b>JPD workflow setup</b> as the partner's value-add, and says the strategy-to-product connection <b>requires change management</b>, which is partner-led work. We have done this spine for enterprise clients across industries. Teams keep working the way they already do. Together we set where strategy, product and delivery connect, and we train the people who will keep those connections in place, because that is what makes the visibility automatic quarter after quarter.</p>
  <p class="mark">The simplest model, all in Jira: the Why lives at the top of the hierarchy in an Initiative, the spine is parent-child, and a Product field on the Epic connects delivery back to product context. Focus and JPD add the leadership and product layers on top of that same spine; they don't replace it.</p></div>`,
  hs:[
   {h:"Our Jira hierarchy is a mess. Every team structures work differently.", s:"That's normal, and it isn't a blocker. Work can connect at any level; the decision is where. We help you set that governance, train the people who keep it in place, and your teams keep working the way they do today. From then on the visibility to strategy and product is automatic.", w:"Turns an objection into the implementation conversation. The spine is the partner's work and the reason the live view holds up."},
   {h:"We already have Jira Plans. Isn't that enough?", s:"Plans shows the cross-cutting roadmap once the work is connected. What it doesn't do is give leadership a place to set priorities, attach OKRs and funding, and see status without reading a Gantt. That's Focus. Plans is still where your program teams will live.", w:"Positions Focus above Plans rather than against it. Both sit on the same spine."}
  ],
  checks:[
   {q:"Why does Atlassian say governance is required at the Delivery level?", o:["Because Jira Plans needs admin permissions","Because work can connect at any level, so someone must decide where","Because Focus can only read Initiatives"], a:1, f:"Teams have different structures. Governance sets where their work connects to strategy and product, not how they work day to day, and training keeps that connection in place."},
   {q:"A prospect's Jira hierarchy is inconsistent across teams. What does that tell you about the deal?", o:["Disqualify; the live view won't work","It's the implementation and change-management work a partner is there to do","Recommend Jira Align instead"], a:1, f:"Configuration, workflow setup and change management are the partner value-adds the Atlassian guide calls out. Teams keep working as they do."}
  ]},
 {id:"signal", n:6, title:"Getting to a Discovery Hypothesis: Highmark Health", mins:"6 min", teaser:"From a news item to a discovery call: how a $674 million operating loss becomes a Strategy Collection conversation.", band:null,
  body:`
  <div class="pic"><svg class="flow" viewBox="0 0 980 453" role="img" aria-label="From signal to solution"><defs><marker id="g1-a" viewBox="0 0 10 441" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--ink-2)"/></marker></defs><text x="490.0" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink-2)" letter-spacing="1.5">FROM SIGNAL TO SOLUTION</text><rect x="14" y="48" width="300" height="96" rx="14" fill="#054950"/><text x="28" y="106" font-size="48" font-weight="800" fill="#fff">1</text><text x="72" y="84" font-size="14" font-weight="800" fill="rgba(255,255,255,.85)" letter-spacing="1.5">INDICATOR</text><text x="72" y="108" font-size="17" font-weight="800" fill="#fff">A fact that</text><text x="72" y="128" font-size="17" font-weight="800" fill="#fff">catches the eye</text><path d="M318 96.0 H334" stroke="var(--ink-2)" stroke-width="2.5" fill="none" marker-end="url(#g1-a)"/><rect x="14" y="156" width="300" height="75" rx="10" fill="#FFFFFF" stroke="#054950" stroke-width="1.5"/><rect x="14" y="156" width="6" height="75" rx="3" fill="#054950"/><text x="32" y="179" font-size="14" font-weight="700" fill="#132426">A number in the news, an earnings</text><text x="32" y="198" font-size="14" font-weight="700" fill="#132426">call, a reorg, a new executive,</text><text x="32" y="217" font-size="14" font-weight="700" fill="#132426">a big bet.</text><rect x="14" y="241" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#054950" stroke-width="1.5"/><rect x="14" y="241" width="6" height="56" rx="3" fill="#054950"/><text x="32" y="264" font-size="14" font-weight="700" fill="#132426">Ask: what business pressure</text><text x="32" y="283" font-size="14" font-weight="700" fill="#132426">does this reveal?</text><rect x="340" y="48" width="300" height="96" rx="14" fill="#C84F09"/><text x="354" y="106" font-size="48" font-weight="800" fill="#fff">2</text><text x="398" y="84" font-size="14" font-weight="800" fill="rgba(255,255,255,.85)" letter-spacing="1.5">THE PROBLEM IT SIGNALS</text><text x="398" y="108" font-size="17" font-weight="800" fill="#fff">Change is costly</text><text x="398" y="128" font-size="17" font-weight="800" fill="#fff">to make</text><path d="M644 96.0 H660" stroke="var(--ink-2)" stroke-width="2.5" fill="none" marker-end="url(#g1-a)"/><rect x="340" y="156" width="300" height="75" rx="10" fill="#FFFFFF" stroke="#C84F09" stroke-width="1.5"/><rect x="340" y="156" width="6" height="75" rx="3" fill="#C84F09"/><text x="358" y="179" font-size="14" font-weight="700" fill="#132426">Priorities shift. Funding moves.</text><text x="358" y="198" font-size="14" font-weight="700" fill="#132426">People stop one thing and</text><text x="358" y="217" font-size="14" font-weight="700" fill="#132426">start another.</text><rect x="340" y="241" width="300" height="37" rx="10" fill="#FFFFFF" stroke="#C84F09" stroke-width="1.5"/><rect x="340" y="241" width="6" height="37" rx="3" fill="#C84F09"/><text x="358" y="264" font-size="14" font-weight="700" fill="#132426">How long does a shift take?</text><rect x="340" y="288" width="300" height="37" rx="10" fill="#FFFFFF" stroke="#C84F09" stroke-width="1.5"/><rect x="340" y="288" width="6" height="37" rx="3" fill="#C84F09"/><text x="358" y="311" font-size="14" font-weight="700" fill="#132426">How much does it cost to make it?</text><rect x="340" y="335" width="300" height="75" rx="10" fill="#FFFFFF" stroke="#C84F09" stroke-width="1.5"/><rect x="340" y="335" width="6" height="75" rx="3" fill="#C84F09"/><text x="358" y="358" font-size="14" font-weight="700" fill="#132426">Can they keep the thread from</text><text x="358" y="377" font-size="14" font-weight="700" fill="#132426">strategy to funding to cost</text><text x="358" y="396" font-size="14" font-weight="700" fill="#132426">to outcomes?</text><rect x="666" y="48" width="300" height="96" rx="14" fill="#0E6E78"/><text x="680" y="106" font-size="48" font-weight="800" fill="#fff">3</text><text x="724" y="84" font-size="14" font-weight="800" fill="rgba(255,255,255,.85)" letter-spacing="1.5">HOW WE SOLVE IT</text><text x="724" y="108" font-size="17" font-weight="800" fill="#fff">A layer on</text><text x="724" y="128" font-size="17" font-weight="800" fill="#fff">what exists</text><rect x="666" y="156" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#0E6E78" stroke-width="1.5"/><rect x="666" y="156" width="6" height="56" rx="3" fill="#0E6E78"/><text x="684" y="179" font-size="14" font-weight="700" fill="#132426">Focus: shift priorities and</text><text x="684" y="198" font-size="14" font-weight="700" fill="#132426">funding in days, not months.</text><rect x="666" y="222" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#0E6E78" stroke-width="1.5"/><rect x="666" y="222" width="6" height="56" rx="3" fill="#0E6E78"/><text x="684" y="245" font-size="14" font-weight="700" fill="#132426">Talent: roughly right workforce</text><text x="684" y="264" font-size="14" font-weight="700" fill="#132426">cost from the HRIS, quickly.</text><rect x="666" y="288" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#0E6E78" stroke-width="1.5"/><rect x="666" y="288" width="6" height="56" rx="3" fill="#0E6E78"/><text x="684" y="311" font-size="14" font-weight="700" fill="#132426">Goals: key results tracked</text><text x="684" y="330" font-size="14" font-weight="700" fill="#132426">against funding. Funding-to-ROI.</text><rect x="666" y="354" width="300" height="75" rx="10" fill="#FFFFFF" stroke="#0E6E78" stroke-width="1.5"/><rect x="666" y="354" width="6" height="75" rx="3" fill="#0E6E78"/><text x="684" y="377" font-size="14" font-weight="700" fill="#132426">Jira and JPD: carry the change</text><text x="684" y="396" font-size="14" font-weight="700" fill="#132426">into product and delivery,</text><text x="684" y="415" font-size="14" font-weight="700" fill="#132426">where work happens.</text></svg><p class="cap">The thought process: a fact in the news, the pressure it reveals, and where Strategy Collection removes the cost of change.</p></div>
  <div class="sec"><h3>Start with the fact that catches your attention</h3>
  <p>Highmark Health, the Pittsburgh-based health system and insurer, reported <b>$32.4 billion in revenue in 2025 and a $674 million operating loss</b>. <b style="color:var(--orange)">Operating expenses exceeded operating revenue by $674 million.</b> That is the detail to notice: a company can generate substantial revenue and still face real pressure on the economics of its business.</p>
  <p>Highmark pointed to elevated medical utilization and claims pressure. Results have since improved, with <b>$805 million in operating income for the first half of 2026</b>. The conversation should recognize both the pressure and the progress.</p></div>

  <div class="sec"><h3>Why that is a signal for us</h3>
  <p>An operating loss of that size gives us a concrete reason to investigate <b>that something is wrong</b>. It tells us where to begin asking questions.</p>
  <p>When a company is adjusting its business to improve performance, <b>what does it cost internally to make those adjustments?</b> Priorities shift. Funding moves. People stop one thing and start another.</p>
  <div class="callout"><p><b>If the systems aren't built for change, it costs more to figure out what to change, and more to get different groups aligned. That is the problem we would investigate.</b></p></div></div>

  <div class="sec"><h3>Follow the signal into discovery</h3>
  <ul><li>What changes are you making in response to the financial pressure?</li>
  <li>When a priority changes, how do you see which people, work and funding are affected?</li>
  <li>As you invest in AI, how are you measuring whether it creates capacity or reduces cost?</li></ul>
  <div class="callout"><p><b>How long does it take to figure that out and get the different groups aligned?</b></p><p><b>Can you maintain the thread from strategy to funding, from funding to actual cost, and from actual cost to outcomes?</b></p></div></div>

  
  <div class="sec"><h3>Strategy Collection differentiators</h3>
  <div class="diff"><p class="diff-h">Don't do a whole enterprise ERP; add a simple layer on top of what already exists.</p></div>
  <p>For a customer already on Jira, the opportunity is to connect strategy and investment decisions to the delivery system where people are already working. That path is quicker and less disruptive than introducing a separate major enterprise tool, and we prove it against the customer's actual integration and adoption requirements.</p>
  <div class="diff"><p class="diff-h">Don't wait for all the financial calculations and the long cycles of workforce planning; connect to your HRIS and get a roughly right idea of cost against strategic outcomes, quickly.</p></div>
  <p>With HRIS data, cost assumptions and the right connections, Talent lets leaders explore which people would move, what capacity that creates or consumes, and what it would cost, without working in Oracle or another financial system for every scenario. Roughly right is the goal: useful for a decision, reconciled with Finance afterwards, and kept distinct from actual financial results.</p>
  <div class="diff"><p class="diff-h">Actively track your key results alongside your strategy, the funding for that investment, and the ongoing costs.</p></div>
  <p>That is true funding-to-ROI, without multiple cycles of spreadsheets.</p>
  <div class="diff"><p class="diff-h">Make the decision and carry it into delivery.</p></div>
  <p>Understand a proposed shift, make the trade-off, and carry the change into the delivery environment. Their priorities are moving quickly; their systems and ways of working need to let them move that quickly too.</p>
  </div>

t-weight="700" fill="#132426">Since recovered: $805M operating</text><text x="32" y="349" font-size="14" font-weight="700" fill="#132426">income in the first half of 2026.</text><rect x="14" y="373" width="300" height="75" rx="10" fill="#FFFFFF" stroke="#054950" stroke-width="1.5"/><rect x="14" y="373" width="6" height="75" rx="3" fill="#054950"/><text x="32" y="396" font-size="14" font-weight="700" fill="#132426">Pressure revealed: the business</text><text x="32" y="415" font-size="14" font-weight="700" fill="#132426">had to change fast, and may</text><text x="32" y="434" font-size="14" font-weight="700" fill="#132426">need to again.</text><rect x="340" y="48" width="300" height="96" rx="14" fill="#C84F09"/><text x="354" y="106" font-size="48" font-weight="800" fill="#fff">2</text><text x="398" y="84" font-size="14" font-weight="800" fill="rgba(255,255,255,.85)" letter-spacing="1.5">THE PROBLEM IT SIGNALS</text><text x="398" y="108" font-size="17" font-weight="800" fill="#fff">What did the</text><text x="398" y="128" font-size="17" font-weight="800" fill="#fff">turnaround cost?</text><path d="M644 96.0 H660" stroke="var(--ink-2)" stroke-width="2.5" fill="none" marker-end="url(#g2-a)"/><rect x="340" y="156" width="300" height="56" rx="10" fill="#FFFFFF" stroke="#C84F09" stroke-width="1.5"/><rect x="340" y="156" width="6" height="56" rx="3" fill="#C84F09"/><text x="358" y="179" font-size="14" font-weight="700" fill="#132426">To improve performance, priorities,</text><text x="358" y="198" font-size="14" font-weight="700" fill="#132426">funding and people all had to move.</text><rect x="340" y="222" width="300" height="94" rx="10" fill="#FFFFFF" stroke="#C84F09" stroke-width="1.5"/><rect x="340" y="222" width="6" height="94" rx="3" fill="#C84F09"/><text x="358" y="245" font-size="14" font-weight="700" fill="#132426">If their systems were not built for</text><text x="358" y="264" font-size="14" font-weight="700" fill="#132426">change, it cost more to work out</text><text x="358" y="283" font-size="14" font-weight="700" fill="#132426">what to change and to get</text><text x="358" y="302" font-size="14" font-weight="700" fill="#132426">groups aligned.</text><rect x="340" y="326" width="300" height="94" rx="10" fill="#FFFFFF" stroke="#C84F09" stroke-width="1.5"/><rect x="340" y="326" width="6" height="94" rx="3" fill="#C84F09"/><text x="358" y="349" font-size="14" font-weight="700" fill="#132426">Discovery: how long did the shift</text><text x="358" y="368" font-size="14" font-weight="700" fill="#132426">take, what did it cost, and can</text><text x="358" y="387" font-size="14" font-weight="700" fill="#132426">they trace strategy to funding</text><text x="358" y="406" font-size="14" font-weight="700" fill="#132426">to cost to outcome?</text><rect x="666" y="48" width="300" height="96" rx="14" fill="#0E6E78"/><text x="680" y="106" font-size="48" font-weight="800" fill="#fff">3</text><text x="724" y="84" font-size="14" font-weight="800" fill="rgba(255,255,255,.85)" letter-spacing="1.5">HOW WE SOLVE IT</text><text x="724" y="108" font-size="17" font-weight="800" fill="#fff">No new ERP;</text><text x="724" y="128" font-size="17" font-weight="800" fill="#fff">a layer on Jira</text><rect x="666" y="156" width="300" height="94" rx="10" fill="#FFFFFF" stroke="#0E6E78" stroke-width="1.5"/><rect x="666" y="156" width="6" height="94" rx="3" fill="#0E6E78"/><text x="684" y="179" font-size="14" font-weight="700" fill="#132426">Focus: Focus Areas carry the</text><text x="684" y="198" font-size="14" font-weight="700" fill="#132426">investment, its goals and budget,</text><text x="684" y="217" font-size="14" font-weight="700" fill="#132426">so a priority change shows the</text><text x="684" y="236" font-size="14" font-weight="700" fill="#132426">affected work at once.</text><rect x="666" y="260" width="300" height="75" rx="10" fill="#FFFFFF" stroke="#0E6E78" stroke-width="1.5"/><rect x="666" y="260" width="6" height="75" rx="3" fill="#0E6E78"/><text x="684" y="283" font-size="14" font-weight="700" fill="#132426">Talent: positions from the HRIS</text><text x="684" y="302" font-size="14" font-weight="700" fill="#132426">give a roughly right cost of</text><text x="684" y="321" font-size="14" font-weight="700" fill="#132426">each shift.</text><rect x="666" y="345" width="300" height="94" rx="10" fill="#FFFFFF" stroke="#0E6E78" stroke-width="1.5"/><rect x="666" y="345" width="6" height="94" rx="3" fill="#0E6E78"/><text x="684" y="368" font-size="14" font-weight="700" fill="#132426">Goals: key results tracked beside</text><text x="684" y="387" font-size="14" font-weight="700" fill="#132426">funding and ongoing cost.</text><text x="684" y="406" font-size="14" font-weight="700" fill="#132426">Funding-to-ROI without</text><text x="684" y="425" font-size="14" font-weight="700" fill="#132426">spreadsheet cycles.</text><rect x="666" y="449" width="300" height="75" rx="10" fill="#FFFFFF" stroke="#0E6E78" stroke-width="1.5"/><rect x="666" y="449" width="6" height="75" rx="3" fill="#0E6E78"/><text x="684" y="472" font-size="14" font-weight="700" fill="#132426">Jira: the decision lands in the</text><text x="684" y="491" font-size="14" font-weight="700" fill="#132426">delivery system their teams</text><text x="684" y="510" font-size="14" font-weight="700" fill="#132426">already use.</text></svg><p class="cap">The same flow with Highmark filled in. You now have a hypothesis to test in discovery.</p></div>`,
  hs:[
   {h:"We've already turned the numbers around. First half of this year we were back to over $800 million in operating income.", s:"That's a significant turnaround, and it's the reason I'm curious: a shift that large means priorities, funding and people moved. When the next one comes, how long does it take you to see which people, work and funding are affected, and how much does it cost you to get everyone aligned and the change into the delivery system?", w:"Acknowledges the progress, then goes straight to the two differentiating questions. The pressure is the opener; the cost of pivoting is the conversation."},
   {h:"We can't have another enterprise tool. We just finished a two-year ERP program.", s:"Understood, and that's why we'd start where your teams already work. Strategy Collection sits on the Jira platform you already run, so strategy and investment decisions connect to delivery without a new system of record for the work. We'd prove that against your integration and adoption requirements before anyone commits.", w:"Turns the tool-fatigue objection into the connect-where-the-work-happens advantage, and promises proof rather than a claim."}
  ],
  checks:[
   {q:"What does the $674 million operating loss establish about Highmark's internal systems?", o:["That disconnected planning systems caused the loss","Nothing by itself; it tells us where to begin asking questions","That they are not a fit for Strategy Collection"], a:1, f:"A signal is a reason to investigate, not a conclusion. We follow it into discovery and validate the problem before we claim anything."},
   {q:"Which two questions bring out Praecipio's differentiation in this example?", o:["How many Jira seats do you have, and are you on Cloud?","How long does it take you to make that shift, and how much does it cost?","Who owns the budget, and when does it renew?"], a:1, f:"The time and cost of pivoting are the baseline against which we show faster decisions, less manual coordination and less effort to put a change into action."},
   {q:"What does \"roughly right\" mean for workforce cost in Talent?", o:["Accurate to the dollar, replacing the finance system","Useful enough to make a decision, reconciled with Finance afterwards and kept distinct from actual results","An estimate we don't share with the customer"], a:1, f:"Leaders need to explore moves and costs without working in Oracle for every scenario. Agree the data and accuracy needed for planning, and keep estimates separate from actuals."}
  ]},
 {id:"who", n:7, title:"Levels: who you're talking to", mins:"6 min", teaser:"Org, Ops, Business and Program leaders, and the one question that opens each.", band:null,
  body:`
  <div class="sec"><h3>Two buying tracks, one thread</h3>
  <p>This play almost always involves several people across two different buying tracks: a <b>product track</b>, where JPD is evaluated, and a <b>strategy track</b>, where Focus and <b>Talent</b> are evaluated. Your job is to find the thread that connects them and make the joint case before the customer treats them as two separate purchasing decisions. <b>Executive reporting</b> is usually that thread.</p>
  <p>The Strategy Stack visual maps who lives where: the executive team plans in years and works in Focus and Talent; portfolio and product teams plan in quarters and work in JPD and Jira; program and delivery teams plan in sprints and days in Jira. Each layer has its own view of the world, and each has one person you need to find.</p></div>

  <h3>The buying committee</h3>
  <div class="ov">
   <div><b>Org Leader: CPO, CTO, VP Engineering</b>This person is the <b>economic buyer</b> for the JPD track and your <b>champion</b> for Strategy Collection. They care about product velocity and strategic alignment. <b>Ask:</b> "When leadership asks whether product is funding company priorities, how long does it take to answer?" Listen for the manual data pull and the stale deck.</div>
   <div><b>Ops Leader: Head of Operations, VP PMO, Head of Strategy</b>This person is the <b>economic buyer</b> for the Strategy Collection track and its power user. They own quarterly planning and feel prioritization pain every cycle. <b>Ask:</b> "When strategy shifts, how long does it take for your product roadmap to reflect that change?" Listen for planning cycles that are out of sync.</div>
   <div><b>Business Leader: CFO, COO, Chief Strategy Officer</b>This person is the <b>final approver</b>. They care about investment ROI, business outcomes and cost control. Finance in the room opens <b>Product ROI</b>, the highest-value conversation in the play. <b>Ask:</b> "How do you currently prove that your product investment is tracking against company strategy?"</div>
   <div><b>Program Lead: Chief of Staff, Head of PMO, Program Manager</b>This person is your <b>champion</b>. They own the day-to-day pain of building the deck and want it gone. <b>Ask:</b> "How many hours does your team spend pulling data for the executive update each quarter?" The answer is also your <b>Metrics</b> number.</div>
  </div>
  <p class="mark">The <b>Product Manager</b> is the day-to-day JPD user. They gain prioritization grounded in <b>Focus Area</b> commitments instead of local team judgment, which makes them an ally on the product track even though they rarely sign.</p></div>
  <div class="sec"><h3>How the journey runs</h3>
  <ul><li><b>Discovery:</b> find the disconnection. Use the opening question for whoever is in the room and listen for the trigger signals.</li>
  <li><b>Qualification:</b> map the committee and confirm <b>net-new</b> status. Get the <b>Org Leader</b> and the <b>Ops Leader</b> into the same conversation before you build the business case.</li>
  <li><b>Value narrative:</b> quantify the pain, hours on reporting and the cost of misaligned bets, and anchor on the outcomes they named, not features.</li>
  <li><b>Close:</b> keep the tracks together. Prevent a Strategy-Collection-only or JPD-only purchase, and bring in the <b>partner manager</b> for deal registration and quoting.</li></ul></div>`,

   {h:"We're evaluating JPD on our side. The strategy team is looking at something separate for OKRs.", s:"Who owns the strategy tooling decision? It's worth getting them in the room with us, because when JPD, Jira and Focus are connected, your executives get real-time information from discovery and delivery rolled up to strategy. That saves hours, if not days, of manual reporting every cycle. Buying them separately is how you lose that.", w:"The deal-splitting moment. Executive reporting is the bridge; bring both tracks together before they diverge."},
   {h:"Finance will want to see the business case before anyone signs.", s:"Good. If your CFO asked today what engineering investment delivered against company strategy last quarter, how long would it take to answer? That's the case we build together: the chain from a JPD idea to Jira delivery to Focus Area performance, with the hours of reporting it removes.", w:"Finance in the committee is an opening, not a hurdle. It unlocks Product ROI."}

   {q:"Which two people should be in the same conversation before you build the business case?", o:["The Program Lead and the Product Manager","The Org Leader and the Ops Leader","The CFO and procurement"], a:1, f:"That's the qualification step in Atlassian's path to close. It is how you keep one deal from becoming two."},

 {id:"sell", n:8, title:"How we sell it", mins:"8 min", teaser:"Pricing for Strategy Collection and JPD, the competition, qualification, and the rules of the play.", band:null,
  body:`
  <div class="sec"><h3>Who this play is for</h3>
  
  
  <p><b>One strong buying signal is enough to qualify the play; two or more means high priority.</b> "We looked at Jira Align but it felt like too much" is a <b>green light</b>: run alignment, prioritization and continuous planning.</p></div>
  <div class="sec"><h3>Pricing and packaging, said correctly</h3>
  <p><b>Strategy Collection</b> lists at <b>$129 per user per month</b> with full feature access and no gating. JPD Premium is priced separately at list. This is <b>not a bundle</b>: separately licensed products positioned together because they solve one connected problem. Never represent them as a single SKU or packaged offer. Jira Align is not part of this play.</p>
  <p>The median mid-market account has 816 Jira seats and Strategy Collection typically lands at about 10% of them, so roughly <b>80 seats</b> is the expected starting point: about $124K a year at list for Focus plus Talent, with 50 seats at $77K and 150 at $232K. Use 80 as your baseline when building the case, and scale as adoption spreads from product to strategy teams. Contact the partner manager before pricing structures or terms go to a customer; they handle quoting guidance and deal registration.</p></div>
  <div class="sec"><h3>JPD pricing, said correctly</h3>
  <p>JPD is priced per <b>creator</b>: the people who create and edit ideas, fields, views and projects. <b>Contributors are free</b> and unlimited; they can see ideas and views, comment, add insights, vote and submit ideas. That is how the rest of the business gets visibility without a seat.</p>
  <ul><li><b>Premium, $25 per creator per month:</b> the fit for mid-market and above. Built for a product organization with multiple product teams: cross-project roadmaps, hierarchies, view restrictions, release tracks, sandbox, Atlassian Intelligence, 24/7 support and a 99.9% SLA. Launched April 30, 2025.</li>
  <li><b>Standard, $10 per creator per month:</b> a single product team.</li>
  <li><b>Free, up to 3 creators:</b> a single, small product team.</li></ul>
  <p><b>Sizing:</b> about <b>30% of Jira seats</b> typically need a JPD creator seat. That covers product managers and product ops plus the extended product team: product engineers, engineering leadership, designers and data scientists. There is no JPD Enterprise plan; if a customer needs more than 5,000 JPD seats, Atlassian's JPD team gets involved before anything is quoted.</p>
  <p><b>Against Aha! and Productboard:</b> JPD is <b>two to four times less expensive</b>, native to Jira, and easier for non-product teams to engage with. Atlassian's own line is that those tools put product managers on an island. If a prospect says they are happy with Productboard's AI or Aha!'s advanced features, JPD may not be the fit yet; share the public roadmap and come back later rather than overselling.</p></div>
  <div class="sec"><h3>What you're really competing with</h3>
  <ul><li>The <b>status quo</b>: spreadsheets and manual reporting. "Free" until you count engineering time, misaligned bets and leadership overhead. Make the invisible cost visible.</li>
  <li><b>ServiceNow SPM and Planview:</b> enterprise PPM pricing and heavy implementation. Atlassian is already in Jira, with no migration and no middleware.</li>
  <li><b>Custom Jira configuration:</b> implementation cost plus ongoing maintenance, brittle at scale. Focus and JPD are purpose-built for the strategy-to-product connection.</li>
  <li><b>Jira Align, SAFe consultants:</b> require a mature Agile-at-scale operating model and a wholesale Jira reconfiguration before delivering value. Focus plus JPD gets there without the transformation program.</li></ul></div>

  <p>Use it as one sentence, not a slide: Forrester placed Atlassian among the Leaders in Value Stream Management in 2025, next to the two enterprise PPM vendors you may be compared with, and Atlassian is the one already running on the platform your teams deliver in. Then go back to the customer's pain.</p></div>
  <div class="sec"><h3>Qualify with MEDDPICC</h3>
  <p class="mark"><b>MEDDPICC</b> is a qualification framework. Each letter is something you need to know before you can trust a deal:</p>
  <ul><li><b>Metrics:</b> the quantified pain.</li>
  <li><b>Economic buyer:</b> who controls the budget.</li>
  <li><b>Decision criteria:</b> what good looks like to them.</li>
  <li><b>Decision process:</b> how and when the decision gets made.</li>
  <li><b>Paper process:</b> procurement, legal, security, purchase orders.</li>
  <li><b>Identify pain:</b> the problem that creates urgency.</li>
  <li><b>Champion:</b> who sells for you inside.</li>
  <li><b>Competition:</b> what else they're evaluating, including doing nothing.</li></ul>
  
  <p>Score each MEDDPICC pillar 0 to 3 at the end of discovery, and never leave a call without a specific next step with a date. Below <b>12 of 24</b>, you don't have a real deal yet. If they can't quantify the pain, the deal won't survive procurement. If the decision criteria aren't defined by you, a competitor will define them, so lock in the native connection between product planning and company OKRs as a criterion early.</p></div>
  <div class="sec"><h3>The rules, in one breath</h3>
  <ul><li><b>Net-new only.</b></li><li><b>Not a bundle.</b></li><li><b>Jira Align excluded.</b></li><li><b>Keep both buying tracks together.</b></li><li><b>Quantify before you price.</b></li></ul><p class="note">Sources: <a href="https://atlassianpartners.atlassian.net/wiki/spaces/resources/pages/754155521/Strategy+Collection" target="_blank" rel="noopener">Strategy Collection</a> and <a href="https://atlassianpartners.atlassian.net/wiki/spaces/resources/pages/359039411/Jira+Product+Discovery+JPD" target="_blank" rel="noopener">Jira Product Discovery</a> (including the JPD Sales Guide) on the Partner Portal.</p></div>`,

   {h:"Can you just bundle Focus and JPD into one price for us?", s:"They're licensed separately, and I'd rather be straight about that. What I can do is show the business case for them together, because the value is in the connection: a JPD idea connects to a Goal that rolls up to a Focus Area, and links to the Jira epic that delivers it, so strategy, product and delivery read from one context and the reporting overhead you described goes away.", w:"Never call it a bundle. Redirect to why they're positioned together."}

function bindBands(){}
function renderModule(id){
  const m=MODULES.find(x=>x.id===id); if(!m||m.locked) return renderHome();
  const idx=MODULES.indexOf(m); const next=MODULES[idx+1];
  view.innerHTML=`
  <p class="crumb"><a href="#" id="crumbHome">Home</a> &rsaquo; Module ${m.n} of 8 &middot; ${esc(m.mins)}</p>
  <h2>${esc(m.title)}</h2>
  ${m.body}
  <div class="sec"><h3>Hear it, say it</h3>
  ${m.hs.map(x=>`<div class="hs"><p class="h">${esc(x.h)}</p><p class="lab">Say</p><p class="s">${esc(x.s)}</p><p class="w">${esc(x.w)}</p></div>`).join("")}</div>
  <div class="sec"><h3>Quick check</h3>
  ${m.checks.map((c,i)=>`<div class="chk" data-i="${i}"><p class="q">${esc(c.q)}</p><div class="opts">${c.o.map((o,j)=>`<button class="opt" data-j="${j}">${esc(o)}</button>`).join("")}</div><p class="fb" hidden></p></div>`).join("")}</div>
  <div class="row">${next?`<button class="btn" id="nextmod">Next: ${esc(next.title)}</button>`:""}<button class="btn alt" id="back">Back to the picture</button></div>`;
  let answered=0;
  view.querySelectorAll(".chk").forEach(box=>{
    const c=m.checks[+box.dataset.i];
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j, ok=j===c.a;
      box.querySelectorAll(".opt").forEach(x=>{x.disabled=true; const xj=+x.dataset.j; if(xj===c.a)x.classList.add("right"); else if(x===b)x.classList.add("wrong"); else x.classList.add("dim");});
      const fb=box.querySelector(".fb"); fb.hidden=false; fb.innerHTML=`<b style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'That\u2019s it.':'Not quite.'}</b> ${esc(c.f)}`;
      answered++; if(answered===m.checks.length){ S.done[m.id]=true; save(S); }
    });
  });
  const nb=document.getElementById("nextmod"); if(nb) nb.onclick=()=>renderModule(next.id);
  document.getElementById("back").onclick=renderHome;
  document.getElementById("crumbHome").onclick=e=>{e.preventDefault();renderHome();};
  bindBands();
  window.scrollTo({top:0});
}
document.getElementById("home").onclick=renderHome;
renderHome();
</script>
